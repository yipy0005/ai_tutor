[workspace]
name = "ai_tutor"
version = "1.0.0"
description = "A friendly Flask learning app for UK KS1/KS2 pupils, with a parent dashboard."
authors = ["ai_tutor"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"
flask = ">=3.0"
flask-sqlalchemy = ">=3.1"
sqlalchemy = ">=2.0"
werkzeug = ">=3.0"
jinja2 = ">=3.1"
click = ">=8.1"

[feature.dev.dependencies]
ruff = ">=0.6"

[environments]
default = { features = [], solve-group = "main" }
dev = { features = ["dev"], solve-group = "main" }

# ---------------------------------------------------------------------------
# Tasks — every Python command for this project runs through pixi.
#   pixi run setup   one-shot: create the database and load the content
#   pixi run dev     start the app with auto-reload (development)
#   pixi run serve   start the app for everyday family use
# ---------------------------------------------------------------------------

[tasks.init-db]
description = "Create the SQLite database and all tables."
cmd = "python -m scripts.init_db"

[tasks.seed]
description = "Load the curriculum content and create the default learner profile."
cmd = "python -m scripts.seed"

[tasks.setup]
description = "Create the database then seed it. Run this first."
depends-on = ["init-db", "seed"]

[tasks.dev]
description = "Run the development server with auto-reload on http://127.0.0.1:5001"
cmd = "flask --app tutor:create_app run --debug --host 127.0.0.1 --port 5001"

[tasks.serve]
description = "Run the app for everyday family use (reachable on your home network)."
cmd = "python -m scripts.serve"

[tasks.reset-db]
description = "Delete the database and rebuild it from scratch. Destroys all progress."
cmd = "python -m scripts.reset_db"

[tasks.restore-backup]
description = "Put a database backup back in place. Stop the app first."
cmd = "python -m scripts.restore_backup"

[tasks.backups]
description = "List the database backups."
cmd = "python -m scripts.restore_backup --list"

[tasks.add-child]
description = "Add a learner profile: pixi run add-child --name Emma --year 3"
cmd = "python -m scripts.add_child"

[tasks.content-check]
description = "Validate every question in the content banks and generators."
cmd = "python -m scripts.content_check"

[tasks.smoke]
description = "End-to-end check that every route and the whole quest flow work."
cmd = "python -m scripts.smoke_test"

[feature.dev.tasks.lint]
description = "Lint the codebase."
cmd = "ruff check tutor scripts"

[feature.dev.tasks.fmt]
description = "Format the codebase."
cmd = "ruff format tutor scripts"
